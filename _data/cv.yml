    Projects:
      - name: EcoRise
        summary: An app that lets people scan their daily activities to track CO2 emissions, wrapped in a gamified leaderboard where schools compete on climate impact. Combines a trained ONNX trash-classifier CNN with an LLM Eco-Coach, behind an eval harness and a FERPA/COPPA privacy engine.
