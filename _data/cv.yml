        position: Machine Learning Research
        summary: Research on graph neural network surrogates for mesh-based physics. Working on 2D/3D aneurysm hemodynamics prediction, including a coefficient LSTM and mean-field operators, and on reducing overfitting in long-horizon rollouts.
        highlights:
          - Graph neural networks for unstructured-mesh fluid dynamics
          - Neural surrogates for vascular blood-flow simulation

      - company: AI applications and hackathon projects
        position: AI Application Development (LLMs)
        summary: Built GreenPath, EcoRise, and Solu. Shipped LLM features behind strict JSON-schema contracts, with retrieval grounding, evaluation harnesses, and explicit refusal handling.
        highlights:
          - JSON-contract LLM features grounded in source documents
          - Eval harnesses, claim verification, and guardrails

      - company: Open-source research
        position: Generative Models (GANs)
        summary: Adversarial-training fork of graph-network physics simulators to sharpen long-horizon rollout stability.
        highlights:
          - GAN training for stable long-rollout simulation

