  summary: Student researcher in machine learning for the physical sciences. I build graph neural network surrogates for mesh-based physics simulation (fluid dynamics and aneurysm hemodynamics) and ship AI products with real evaluation, grounding, and guardrails. I like turning messy scientific and real-world problems into models that are fast, honest about their limits, and actually useful.

